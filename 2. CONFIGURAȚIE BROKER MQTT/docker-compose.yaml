version: '3.8'

services:
  # Broker MQTT - Mosquitto
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    ports:
      - "1883:1883"    # MQTT non-TLS
      - "9001:9001"    # WebSocket
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    restart: unless-stopped
    networks:
      - iot-network

  # Bridge MQTT to Database
  mqtt-bridge:
    build: ./bridge
    container_name: mqtt-bridge
    depends_on:
      - mosquitto
      - postgres
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=petfeeder
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
    volumes:
      - ./bridge:/app
    restart: unless-stopped
    networks:
      - iot-network

  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_DB=petfeeder
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - iot-network

  # Admin Interface - MQTT Explorer
  mqtt-explorer:
    image: b4bz/homer:latest
    container_name: mqtt-explorer
    ports:
      - "8080:8080"
    depends_on:
      - mosquitto
    environment:
      - INITIAL_CONFIG='{"mqtt":{"connection":{"host":"mosquitto","port":1883}}}'
    restart: unless-stopped
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge